name: Pruebas

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias (versiones fijadas)
        run: pip install -r requirements-dev.txt
      - name: Correr pruebas
        run: python -m pytest tests/ -q
